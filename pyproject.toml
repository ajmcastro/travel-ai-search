[project]
name = "travel-ai-search"
version = "0.1.0"
description = "Educational project demonstrating modern AI search architectures for travel"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Antonio Castro" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "fastapi>=0.141.1",
    "opensearch-py>=2.7.0",
    "pydantic-settings>=2.6.0",
    "sentence-transformers>=5.7.0",
    "uvicorn>=0.52.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_ai_search"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "integration: marks tests requiring a running OpenSearch instance (run with: uv run pytest tests/integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Destination data rows are intentionally kept one-per-line for readability.
"scripts/generate_dataset.py" = ["E501"]
# Lambda criteria in the golden dataset builder are kept one-per-line for readability.
# sys.path.insert() before src imports is intentional in standalone scripts.
"scripts/build_golden_dataset.py" = ["E402", "E501"]
# sys.path.insert() before src imports is intentional in standalone scripts.
"scripts/ingest_knowledge.py" = ["E402"]
"scripts/ingest_data.py" = ["E402"]
"scripts/generate_embeddings.py" = ["E402"]
"scripts/create_index.py" = ["E402"]
"scripts/evaluate.py" = ["E402"]
"scripts/healthcheck.py" = ["E402"]
"scripts/prepare_fine_tuning_data.py" = ["E402"]
"scripts/fine_tune_embeddings.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
