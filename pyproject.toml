[project]
name = "travel-ai-search"
version = "0.1.0"
description = "Educational project demonstrating modern AI search architectures for travel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opensearch-py>=2.7.0",
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_ai_search"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "integration: marks tests requiring a running OpenSearch instance (run with: uv run pytest tests/integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Destination data rows are intentionally kept one-per-line for readability.
"scripts/generate_dataset.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
